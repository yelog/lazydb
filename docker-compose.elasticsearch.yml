services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${LAZYDB_TEST_ELASTICSEARCH_VERSION:-8.17.0}
    environment:
      discovery.type: single-node
      # Disposable fixture: Docker Desktop's shared disk may exceed production watermarks.
      cluster.routing.allocation.disk.threshold_enabled: "false"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: "${LAZYDB_TEST_ELASTICSEARCH_PASSWORD:-lazydb-local-test-only}"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 2g
    ports:
      - "127.0.0.1:${LAZYDB_TEST_ELASTICSEARCH_PORT:-19200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  certificates:
    image: docker.elastic.co/elasticsearch/elasticsearch:${LAZYDB_TEST_ELASTICSEARCH_VERSION:-8.17.0}
    user: "0"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        if [ ! -f /certs/localhost/localhost.crt ]; then
          bin/elasticsearch-certutil cert --silent --self-signed --pem --name localhost --dns localhost --out /certs/certs.zip
          unzip -q /certs/certs.zip -d /certs
        fi
        chown -R 1000:0 /certs
        chmod 750 /certs /certs/localhost
        chmod 640 /certs/localhost/*
    volumes:
      - certificates:/certs

  elasticsearch-tls:
    image: docker.elastic.co/elasticsearch/elasticsearch:${LAZYDB_TEST_ELASTICSEARCH_VERSION:-8.17.0}
    depends_on:
      certificates:
        condition: service_completed_successfully
    environment:
      discovery.type: single-node
      # Disposable fixture: Docker Desktop's shared disk may exceed production watermarks.
      cluster.routing.allocation.disk.threshold_enabled: "false"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: test-certs/localhost/localhost.key
      xpack.security.http.ssl.certificate: test-certs/localhost/localhost.crt
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: "${LAZYDB_TEST_ELASTICSEARCH_PASSWORD:-lazydb-local-test-only}"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 2g
    volumes:
      - certificates:/usr/share/elasticsearch/config/test-certs:ro
    ports:
      - "127.0.0.1:${LAZYDB_TEST_ELASTICSEARCH_TLS_PORT:-19201}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail --cacert config/test-certs/localhost/localhost.crt -u elastic:$$ELASTIC_PASSWORD https://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  certificates:
