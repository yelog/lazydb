# LazyDB built-in defaults.
#
# This file is embedded into the binary and is the authoritative source for
# user-facing application defaults. Copy only the values you want to change to
# ~/lazydb/settings.toml for new users. Existing installations keep their
# selected root. Explicit command-line options take precedence.

version = 1

[terminal]
mouse = "auto"
color = "auto"

[terminal.clipboard]
backend = "system"
max_bytes = 1000000

[ui]
icons = "nerd-font"
motion = "full"
help_panel = "help"

[execution]
confirmation = "risky"

[connections]
# Driver authentication/CA options (including OpenSearch) belong to saved
# profiles in connections.toml, not to application defaults in this file.
default_access = "global"

[dashboard]
refresh_interval_seconds = 5

[redis]
# SCAN COUNT is a server-side hint, not a hard result limit.
scan_count_hint = 200
# Number of values requested by one collection page.
page_size = 200
string_page_bytes = 65536
# In-memory key-store conversion thresholds.
memory_key_limit = 10000
memory_key_bytes = 16777216
# Raw and formatted value-page budgets.
value_page_bytes = 1048576
value_format_bytes = 1048576
# Delay and concurrency controls for interactive previews.
preview_debounce_ms = 100
max_read_concurrency = 4
auto_fill_request_limit = 8
auto_fill_budget_ms = 100
# Temporary SQLite index and visible-key metadata cache limits.
index_disk_limit_bytes = 1073741824
metadata_cache_capacity = 2000
metadata_cache_ttl_seconds = 5

[updates]
check_on_startup = true
check_interval_hours = 24

[keybindings]
# The preset covers the complete Vim editing contract documented in
# docs/keybindings.md. The grouped tables below follow the panel where each
# application shortcut is active.
# Key chords accept Ctrl/Control, Alt/Option, Shift, and Cmd/Command/Super
# modifiers joined with + or - (for example Cmd+Ctrl+h). Separate sequence
# steps with spaces (for example Ctrl-w h). Arrays replace defaults; use [] to
# disable a configurable binding, or list both values to keep both bindings.
preset = "vim"
# Ordinary adjacent-key sequences expire after this interval. Space/Leader
# menus remain active until execution, cancellation, or a context change.
sequence_timeout_ms = 750

[keybindings.global]
# F2 opens the global action and object switcher.
omni = ["F2"]
# F1 opens contextual Help.
# ? opens contextual Help outside editor input states.
help = ["F1", "?"]
# Ctrl-C exits the application outside cancellation handling.
quit = ["Ctrl-c"]
# Temporarily release mouse capture for terminal-native text selection.
terminal-selection = ["Ctrl-Shift-s"]
# F8 opens notification history.
notification-history = ["F8"]
# F7 opens SQL execution history.
open-sql-history = ["F7"]
# F6 opens the global console manager from every input context.
open-consoles = ["F6"]
# F9 opens the update center.
update = ["F9"]
# Tab focuses the next pane.
# Shift-Tab focuses the previous pane.
focus-next-pane = ["Tab"]
focus-previous-pane = ["Shift-Tab"]
# F5 runs the current statement.
run-statement = ["F5"]
# Shift-F5 runs the complete SQL buffer.
run-buffer = ["Shift-F5"]
# Ctrl-N selects the next tab.
# g-t and ]-t are next-tab aliases.
next-tab = ["Ctrl-n", "g t", "] t"]
# Ctrl-P selects the previous tab.
# g-T and [-t are previous-tab aliases.
previous-tab = ["Ctrl-p", "g T", "[ t"]
# Ctrl-Shift-N swaps the active tab with the tab on its right.
move-tab-right = ["Ctrl-Shift-n"]
# Ctrl-Shift-P swaps the active tab with the tab on its left.
move-tab-left = ["Ctrl-Shift-p"]
# Ctrl-Q closes the active tab.
close-tab = ["Ctrl-q"]

[keybindings.leader]
# Space-b opens the Dashboard when the active profile supports it.
open-dashboard = ["Space b"]
# Space-c focuses the connection Explorer.
open-explorer = ["Space c"]
# Space-s opens the SQL console manager.
open-editors = ["Space s"]
# Space-r/R run the current statement or complete buffer.
run-leader-statement = ["Space r"]
run-leader-buffer = ["Space R"]
# Space-d opens the execution target selector.
open-target-selector = ["Space d"]
# Space-D opens the active connection's database selector.
open-database-selector = ["Space D"]

[keybindings.panes]
# Ctrl-w h focuses the left pane.
focus-pane-left = ["Ctrl-w h"]
# Ctrl-w j focuses the pane below.
focus-pane-down = ["Ctrl-w j"]
# Ctrl-w k focuses the pane above.
focus-pane-up = ["Ctrl-w k"]
# Ctrl-w l focuses the right pane.
focus-pane-right = ["Ctrl-w l"]
# Ctrl-w f maximizes the focused pane.
toggle-pane-maximized = ["Ctrl-w f"]
# Optional synchronized Kitty/LazyDB maximize. Kitty must forward this shortcut.
smart-toggle-pane-maximized = []
# Ctrl-w = restores the default pane sizes.
reset-pane-sizes = ["Ctrl-w ="]
# Optional cross-application navigation. Kitty must forward cmd+ctrl h/j/k/l.
smart-focus-pane-left = []
smart-focus-pane-down = []
smart-focus-pane-up = []
smart-focus-pane-right = []
smart-resize-pane-left = []
smart-resize-pane-down = []
smart-resize-pane-up = []
smart-resize-pane-right = []

[keybindings.explorer]
# j moves down through Explorer entries.
move-down = ["j"]
# k moves up through Explorer entries.
move-up = ["k"]
# l expands the selected Explorer entry.
expand = ["l"]
# h collapses the selected Explorer entry.
collapse = ["h"]
# y copies the selected Explorer name.
copy-selection = ["y"]
# / opens visible-node find.
find = ["/"]
# f opens catalog search.
search = ["f"]
# r refreshes the Explorer catalog.
refresh = ["r"]
# o toggles expansion of the selected entry.
toggle = ["o"]
# Create native Mongo collection/view/index drafts from Explorer.
create = ["c"]
# Edit collection options/validator or inspect an index management draft.
edit = ["e"]
# Drop a Mongo collection/view/index after exact-name confirmation.
delete = ["d"]
# Rename the selected Mongo collection after exact-name confirmation.
rename = ["R"]

[keybindings.results]
# Ctrl-Home/Ctrl-End load the first/last database page.
first-page = ["Ctrl-Home"]
# PageUp/PageDown load the previous/next database page.
previous-page = ["PageUp"]
next-page = ["PageDown"]
# P opens the page-size selector.
page-size = ["P"]
last-page = ["Ctrl-End"]
# h moves left through the result grid.
move-left = ["h"]
# j moves down through the result grid.
move-down = ["j"]
# k moves up through the result grid.
move-up = ["k"]
# l moves right through the result grid.
move-right = ["l"]
# v opens Record View.
open-record = ["v"]
# y copies the selected cell.
copy-cell = ["y"]
# Y copies the selected row.
copy-row = ["Y"]
# Space-Y copies the selected row including column headers.
copy-row-headers = ["Space Y"]
# o toggles between result views.
toggle-view = ["o"]
# 0 and ^ select the first column.
first-column = ["0", "^"]
# $ selects the last column.
last-column = ["$"]
# z-z centers the selected row in the viewport.
align-middle = ["z z"]
# z-t aligns the selected row to the top.
align-top = ["z t"]
# z-b aligns the selected row to the bottom.
align-bottom = ["z b"]

[keybindings.editor]
# Editor-owned Vim and modalkit keys are intentionally documented here as a
# preset, but are not individually remapped by the application mapper yet.

[keybindings.overlays]
# Overlay-specific text-entry and confirmation keys remain context-owned.
