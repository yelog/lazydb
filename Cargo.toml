[package]
name = "lazydb"
version = "0.1.0-beta.2"
edition = "2024"
rust-version = "1.94"
description = "A keyboard-first terminal database IDE"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yelog/lazydb"
homepage = "https://github.com/yelog/lazydb"
readme = "README.md"
keywords = ["database", "sql", "terminal", "tui"]
categories = ["command-line-utilities", "database"]

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", default-features = false }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
futures-util = "0.3"
keyring = "4.1.6"
modalkit = { version = "=0.0.25", features = ["clipboard"] }
nerd-font-symbols = "0.3"
percent-encoding = "2.3"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
tar = "0.4"
rmcp = { version = "3.1.4", default-features = false, features = ["server", "macros", "transport-io"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sqlformat = "0.5"
sqlparser = { version = "0.62", features = ["visitor"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "mysql", "sqlite", "uuid", "chrono"] }
sqlx-core = "0.9.0"
tachyonfx = { version = "0.25.1", default-features = false, features = ["std"] }
thiserror = "2.0"
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1.47", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }
xz2 = "0.1"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = "symbols"
