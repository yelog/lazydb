[package]
name = "lazydb"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A keyboard-first terminal database IDE"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lazydb/lazydb"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
futures-util = "0.3"
keyring = "4.1.6"
modalkit = { version = "=0.0.25", features = ["clipboard"] }
nerd-font-symbols = "0.3"
percent-encoding = "2.3"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
regex = "1"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlformat = "0.5"
sqlparser = "0.62"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "mysql", "sqlite", "uuid"] }
sqlx-core = "0.9.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = "symbols"
