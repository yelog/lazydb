worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log /dev/stdout;

    server {
        listen 8080;
        server_name clickhouse.internal;

        location / {
            default_type text/plain;
            return 200 "24.1.1.1\tdefault\tdefault\n";
        }
    }

    server {
        listen 8443 ssl;
        server_name search.internal opensearch.internal;
        ssl_certificate /run/lazydb-http/http.crt;
        ssl_certificate_key /run/lazydb-http/http.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = / {
            default_type application/json;
            if ($host = opensearch.internal) {
                return 200 '{"version":{"number":"2.19.0","distribution":"opensearch"}}';
            }
            return 200 '{"version":{"number":"8.15.0"}}';
        }

        location / {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }
    }
}
