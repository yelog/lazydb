name: Linux container cache verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-cache-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  container:
    name: Pinned container (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            image: ubuntu:22.04@sha256:98510ac07bb4545e389be502a8918b385c018bfe4ceeb5ac7e0375c782268b04
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            image: ubuntu:22.04@sha256:88881eb36da489f9ff8746ece8048ca16cc94f80e8cd3ae7e8335d8822631591
    env:
      LAZYDB_LINUX_BUILD_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up isolated native dependency probe
        run: python3 scripts/release/verify-container-probe.py prepare
      - name: Prepare approved native build image
        run: sh .container-probe/scripts/release/build-linux.sh "${{ matrix.target }}" --prepare
      - name: Verify toolchain and metadata paths inside the container
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release/verify-container-probe.py metadata "$TARGET"
      - name: Cache pinned container dependencies
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: container-verification-${{ matrix.target }}-${{ matrix.image }}-${{ hashFiles('scripts/release/Dockerfile.linux', 'scripts/release/build-linux.sh') }}
          workspaces: .container-probe -> target
          cmd-format: sh ${{ github.workspace }}/.container-probe/scripts/release/build-linux.sh ${{ matrix.target }} --exec {0}
          cache-bin: false
          cache-targets: true
          cache-on-failure: true
      - name: Build probe with a bundled native dependency
        run: sh .container-probe/scripts/release/build-linux.sh "${{ matrix.target }}" 2>&1 | tee container-build.log
      - name: Verify executable and native dependency reuse
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release/verify-container-probe.py result "$TARGET"
      - name: Upload verification evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: container-verification-${{ matrix.target }}
          path: |
            container-build.log
            container-result.json
            .container-probe/target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7
