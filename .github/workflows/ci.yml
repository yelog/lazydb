name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  distribution:
    name: Distribution contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: sh scripts/release/test-distribution.sh

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --no-self-update
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  databases:
    name: PostgreSQL, MySQL, and SQL Server adapters
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lazydb_test
          POSTGRES_DB: lazydb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lazydb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: lazydb_test
          MYSQL_DATABASE: lazydb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -plazydb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: LazydbC1!SqlServer2022
        ports:
          - 1433:1433
        options: >-
          --platform linux/amd64
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      LAZYDB_TEST_POSTGRES_URL: postgresql://postgres:lazydb_test@127.0.0.1:5432/lazydb_test
      LAZYDB_TEST_MYSQL_URL: mysql://root:lazydb_test@127.0.0.1:3306/lazydb_test
      LAZYDB_TEST_SQLSERVER_URL: sqlserver://sa:LazydbC1!SqlServer2022@127.0.0.1:1433/tempdb?encrypt=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.94.0 --profile minimal --no-self-update
      - run: rustup default 1.94.0
      - name: PostgreSQL adapter tests
        run: timeout 10m cargo test --locked --test postgres_adapter -- --nocapture --test-threads=1
      - name: MySQL adapter tests
        run: timeout 10m cargo test --locked --test mysql_adapter -- --nocapture --test-threads=1
      - name: SQL Server adapter tests
        run: timeout 10m cargo test --locked --test sqlserver_adapter -- --nocapture --test-threads=1
      - name: SQL Server transaction tests
        run: timeout 10m cargo test --locked --test sqlserver_transactions -- --nocapture --test-threads=1
