name: Pages

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy to Pages
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  assemble:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.name == 'Release')
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Manual redeploys use the selected workflow ref's installer fixes,
          # while the tag input selects only the existing release assets.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Distribution contracts
        run: sh scripts/release/test-distribution.sh
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ -n "$INPUT_TAG" ]; then
            TAG=$INPUT_TAG
          else
            [ -n "$RUN_SHA" ] || { echo 'missing Release workflow head SHA' >&2; exit 1; }
            tags=$(git tag --points-at "$RUN_SHA" 'v*' | sort -V)
            [ "$(printf '%s\n' "$tags" | awk 'NF { count++ } END { print count + 0 }')" = 1 ] || {
              echo "expected exactly one release tag at $RUN_SHA, found:" >&2
              printf '%s\n' "$tags" >&2
              exit 1
            }
            TAG=$tags
          fi
          case "$TAG" in v*) ;; *) echo "invalid release tag: $TAG" >&2; exit 1 ;; esac
          git show-ref --verify --quiet "refs/tags/$TAG" || { echo "release tag not found: $TAG" >&2; exit 1; }
          version=${TAG#v}
          case "$version" in *-beta.*) channel=beta ;; *) channel=stable ;; esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p dist existing-pages/v2
          gh release download "$TAG" --dir dist --repo "$GITHUB_REPOSITORY"
          published_at=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
          opposite=stable
          [ "$channel" = stable ] && opposite=beta
          fetch_optional() {
            url=$1
            output=$2
            status_file=$(mktemp)
            http_code=$(curl --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 30 \
              --output "$output" --write-out '%{http_code}' "$url" 2>"$status_file") || {
                cat "$status_file" >&2
                rm -f "$status_file" "$output"
                echo "failed to fetch existing Pages manifest: $url" >&2
                exit 1
              }
            rm -f "$status_file"
            case "$http_code" in
              200) ;;
              404) rm -f "$output" ;;
              *) rm -f "$output"; echo "unexpected HTTP $http_code fetching $url" >&2; exit 1 ;;
            esac
          }
          fetch_optional "https://lazydb.yelog.org/channels/$opposite.json" "existing-pages/$opposite.json"
          fetch_optional "https://lazydb.yelog.org/channels/v2/$opposite.json" "existing-pages/v2/$opposite.json"
          # For first migration deployments only, a checked-in legacy v1 manifest
          # may be retained. There is no fabricated v2 document; its route remains 404.
          if [ ! -f "existing-pages/$opposite.json" ] && [ -f "pages/$opposite.json" ]; then
            cp "pages/$opposite.json" "existing-pages/$opposite.json"
          fi
          sh scripts/release/assemble-pages.sh "$channel" "$version" "$published_at" dist pages existing-pages _site
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    name: Online installation (${{ matrix.os }})
    needs: [assemble, deploy]
    strategy:
      fail-fast: false
      matrix:
         os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Install from public Pages endpoint
        env:
          CHANNEL: ${{ needs.assemble.outputs.channel }}
          VERSION: ${{ needs.assemble.outputs.version }}
        run: sh scripts/release/smoke-online-install.sh "$CHANNEL" "$VERSION"

  verify-windows:
    name: Online Windows installation (${{ matrix.shell }})
    needs: [assemble, deploy]
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Install from public Pages endpoint
        if: matrix.shell == 'powershell'
        shell: powershell
        env:
          CHANNEL: ${{ needs.assemble.outputs.channel }}
          VERSION: ${{ needs.assemble.outputs.version }}
        run: ./scripts/release/smoke-online-install.ps1 -Channel $env:CHANNEL -Version $env:VERSION -AllowUserPathMutation
      - name: Install from public Pages endpoint (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        env:
          CHANNEL: ${{ needs.assemble.outputs.channel }}
          VERSION: ${{ needs.assemble.outputs.version }}
        run: ./scripts/release/smoke-online-install.ps1 -Channel $env:CHANNEL -Version $env:VERSION -AllowUserPathMutation
