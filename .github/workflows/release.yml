name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild or recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Manual recovery runs use current main for workflow/code fixes while
          # retaining the explicitly selected release tag as the artifact target.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - id: release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          tag=${INPUT_TAG:-${GITHUB_REF_NAME}}
          case "$tag" in v*) ;; *) echo "invalid release tag: $tag" >&2; exit 1;; esac
          version=${tag#v}
          printf '%s\n' "$tag" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$'
          scripts/release/validate-version.sh "$tag"
          if printf '%s' "$tag" | grep -q -- '-beta\.'; then channel=beta; prerelease=true; else channel=stable; prerelease=false; fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  quality:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || needs.plan.outputs.tag }}
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy --no-self-update
      - run: cargo +1.94.0 fmt --all -- --check
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci-ubuntu-24.04
          cmd-format: sh scripts/ci/rust-cache-command.sh {0}
          cache-bin: false
          cache-targets: true
          save-if: false
      - name: Distribution contracts
        run: |
          sh scripts/release/test-distribution.sh
          python3 -B scripts/release/test-linux-runtime.py
          test "$(uname -s)" != Linux || python3 -B -c 'import runpy, unittest; module=runpy.run_path("scripts/release/test-linux-runtime.py"); suite=unittest.defaultTestLoader.loadTestsFromTestCase(module["LinuxElfIntegrationTests"]); result=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(not result.wasSuccessful() or result.skipped != [])'
      - run: cargo +1.94.0 clippy --locked --all-targets --all-features --timings -- -D warnings
      - run: cargo +1.94.0 test --locked --all-targets --all-features --timings

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            image: ubuntu:22.04@sha256:98510ac07bb4545e389be502a8918b385c018bfe4ceeb5ac7e0375c782268b04
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            image: ubuntu:22.04@sha256:88881eb36da489f9ff8746ece8048ca16cc94f80e8cd3ae7e8335d8822631591
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      LAZYDB_LINUX_BUILD_IMAGE: ${{ matrix.image || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || needs.plan.outputs.tag }}
      - name: Install Rust on the host
        if: runner.os != 'Linux'
        run: rustup toolchain install 1.94.0 --target "${{ matrix.target }}" --profile minimal --no-self-update
      - name: Prepare pinned Linux build image
        if: runner.os == 'Linux'
        run: sh scripts/release/build-linux.sh "${{ matrix.target }}" --prepare
      - name: Cache Rust build
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-${{ matrix.os }}-${{ matrix.target }}
          cmd-format: sh scripts/ci/rust-cache-command.sh {0}
          cache-bin: false
          cache-targets: true
          cache-on-failure: true
      - name: Cache pinned Linux build dependencies
        if: runner.os == 'Linux'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-linux-${{ matrix.target }}-${{ matrix.image }}-${{ hashFiles('scripts/release/Dockerfile.linux', 'scripts/release/build-linux.sh') }}
          cmd-format: sh scripts/release/build-linux.sh ${{ matrix.target }} --exec {0}
          cache-bin: false
          cache-targets: true
          cache-on-failure: true
      - name: Build Linux in the pinned native image
        if: runner.os == 'Linux'
        run: sh scripts/release/build-linux.sh "${{ matrix.target }}"
      - name: Record Linux build toolchain and image
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.plan.outputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          mkdir -p dist
          sh scripts/release/build-linux.sh "$TARGET" --exec readelf --version > dist/readelf-version.txt
          python3 - "$TARGET" "$IMAGE" "$RUNNER_ARCH" "$(sed -n '1p' dist/readelf-version.txt)" \
            > "dist/lazydb_${VERSION}_${TARGET}.build.json" <<'PY'
          import json, sys
          target, image, host_arch, readelf = sys.argv[1:]
          json.dump({
              "target": target,
              "image": image,
              "host_arch": host_arch,
              "rust": "1.94.0",
              "readelf": readelf,
          }, sys.stdout, indent=2, sort_keys=True)
          sys.stdout.write("\n")
          PY
      - name: Build macOS and Windows
        if: matrix.target != 'x86_64-unknown-linux-gnu' && matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo +1.94.0 build --release --locked --target "${{ matrix.target }}" --timings
      - name: Check macOS binary dependencies
        if: matrix.target == 'x86_64-apple-darwin' || matrix.target == 'aarch64-apple-darwin'
        run: scripts/release/check-macos-dependencies.sh "target/${{ matrix.target }}/release/lazydb"
      - name: Smoke test
        if: matrix.os != 'windows-2025'
        run: scripts/release/smoke-artifact.sh "target/${{ matrix.target }}/release/lazydb" "${{ needs.plan.outputs.version }}"
      - name: Report binary size and dynamic dependencies
        if: matrix.os != 'windows-2025'
        run: scripts/release/check-binary-size.sh "target/${{ matrix.target }}/release/lazydb"
      - name: Assemble archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -eu
          mkdir -p dist/package
          staging="dist/package/lazydb_${VERSION}_${TARGET}"
          mkdir "$staging"
          executable="target/$TARGET/release/lazydb"
          output_name=lazydb
          if [ "$TARGET" = x86_64-pc-windows-msvc ]; then executable="${executable}.exe"; output_name=lazydb.exe; fi
          cp "$executable" "$staging/$output_name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$staging/"
          if [ "$TARGET" = x86_64-pc-windows-msvc ]; then
             (cd dist/package && 7z a -tzip "../lazydb_${VERSION}_${TARGET}.zip" "lazydb_${VERSION}_${TARGET}")
          else
            python3 scripts/release/package-archive.py "$staging" "dist/lazydb_${VERSION}_${TARGET}.tar.xz"
            mkdir -p dist/smoke
            tar -xJf "dist/lazydb_${VERSION}_${TARGET}.tar.xz" -C dist/smoke
            cmp "$executable" "dist/smoke/lazydb_${VERSION}_${TARGET}/lazydb"
            if [ "$TARGET" = x86_64-unknown-linux-gnu ] || [ "$TARGET" = aarch64-unknown-linux-gnu ]; then
              report="dist/lazydb_${VERSION}_${TARGET}.runtime.json"
              python3 scripts/release/linux-runtime.py inspect \
                --archive "dist/lazydb_${VERSION}_${TARGET}.tar.xz" \
                --binary "$executable" --target "$TARGET" --version "$VERSION" --output "$report"
              python3 scripts/release/linux-runtime.py check-policy \
                --report "$report" --policy scripts/release/linux-compatibility-policy.json
            fi
            scripts/release/smoke-artifact.sh "dist/smoke/lazydb_${VERSION}_${TARGET}/lazydb" "$VERSION"
            if [ "$TARGET" = x86_64-apple-darwin ] || [ "$TARGET" = aarch64-apple-darwin ]; then
              scripts/release/check-macos-dependencies.sh "dist/smoke/lazydb_${VERSION}_${TARGET}/lazydb"
            fi
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.4.3
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.xz
            dist/*.zip
            dist/*.runtime.json
            dist/*.build.json
          if-no-files-found: error
      - name: Upload release build timings
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.4.3
        with:
          name: build-timings-${{ matrix.target }}
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7

  package:
    needs: [plan, build, quality]
    if: needs.plan.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || needs.plan.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'release-*-unknown-linux-gnu', path: dist, merge-multiple: true }
      - name: Install nFPM
        run: |
          GOBIN="$HOME/.local/bin" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.42.0
          "$HOME/.local/bin/nfpm" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build packages
        run: |
          set -eu
          mkdir -p dist/packages
          for archive in dist/*unknown-linux-gnu.tar.xz; do
            target=$(basename "$archive" .tar.xz | sed 's/^lazydb_[0-9][0-9.]*_//')
            mkdir -p "dist/unpack/$target"
            tar -xJf "$archive" -C "dist/unpack/$target" --strip-components=1
            report="dist/lazydb_${{ needs.plan.outputs.version }}_${target}.runtime.json"
            scripts/release/package-linux.sh "${{ needs.plan.outputs.version }}" "${target%%-*}" "dist/unpack/$target/lazydb" "$report" dist/packages
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.4.3
        with: { name: release-packages, path: 'dist/packages/*', if-no-files-found: error }

  runtime:
    needs: [plan, build, quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || needs.plan.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: 'release-${{ matrix.target }}', path: dist }
      - name: Run final archive smoke
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          archive="dist/lazydb_${VERSION}_${TARGET}.tar.xz"
          report="dist/lazydb_${VERSION}_${TARGET}.runtime.json"
          evidence="dist/lazydb_${VERSION}_${TARGET}.runtime-evidence.json"
          sh scripts/release/smoke-linux-runtime.sh "$archive" "$report" "$VERSION" "$TARGET" "$evidence"
          sh scripts/release/test-linux-runtime-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.4.3
        with: { name: 'runtime-${{ matrix.target }}', path: 'dist/*.runtime-evidence.json', if-no-files-found: error }

  publish:
    needs: [plan, build, package, quality, runtime]
    if: always() && needs.plan.result == 'success' && needs.quality.result == 'success' && needs.build.result == 'success' && needs.runtime.result == 'success' && (needs.package.result == 'success' || needs.package.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || needs.plan.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'release-*', path: dist, merge-multiple: true }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'runtime-*', path: dist, merge-multiple: true }
      - name: Prepare release assets
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -eu
          cp "$GITHUB_WORKSPACE/install.sh" dist/lazydb-installer.sh
          cp "$GITHUB_WORKSPACE/pages/install.ps1" dist/lazydb-installer.ps1
          chmod 0755 dist/lazydb-installer.sh
          find dist -mindepth 2 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -exec cp {} dist/ \; 2>/dev/null || true
          if [ "$CHANNEL" = beta ]; then rm -f dist/lazydb-installer.sh dist/lazydb-installer.ps1; fi
          scripts/release/generate-sbom.sh "$VERSION" "dist/lazydb-${VERSION}-sbom.spdx.json"
          (
            cd dist
            checksums=$(mktemp)
            find . -maxdepth 1 -type f ! -name SHA256SUMS -exec basename {} \; | sort | xargs sha256sum > "$checksums"
            mv "$checksums" SHA256SUMS
          )
          body=$(scripts/release/changelog-section.sh "$VERSION")
          [ -n "$body" ] || { echo 'empty Changelog section' >&2; exit 1; }
          printf '%s\n' "$body" > dist/release-notes.md
          scripts/release/check-assets.sh "$CHANNEL" "$VERSION" dist
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "LazyDB v$VERSION" --notes-file dist/release-notes.md
          else
            gh release edit "$TAG" --title "LazyDB v$VERSION" --notes-file dist/release-notes.md --draft
          fi
          find dist -maxdepth 1 -type f ! -name release-notes.md -print0 | xargs -0 gh release upload "$TAG" --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --prerelease --draft=false
          else
            gh release edit "$TAG" --prerelease=false --draft=false
          fi
          gh release view "$TAG" --json url,assets

  homebrew:
    needs: [plan, publish]
    if: needs.plan.outputs.channel == 'stable' && needs.publish.result == 'success'
    runs-on: macos-14
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Update stable Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -eu
          test -n "$GH_TOKEN"
          git clone "https://x-access-token:$GH_TOKEN@github.com/yelog/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp packaging/homebrew/lazydb.rb tap/Formula/lazydb.rb
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT HUP INT TERM
          curl --fail --location --proto '=https' --tlsv1.2 -o "$tmp/intel.tar.xz" "https://github.com/yelog/lazydb/releases/download/$TAG/lazydb_${VERSION}_x86_64-apple-darwin.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 -o "$tmp/arm.tar.xz" "https://github.com/yelog/lazydb/releases/download/$TAG/lazydb_${VERSION}_aarch64-apple-darwin.tar.xz"
          intel=$(shasum -a 256 "$tmp/intel.tar.xz" | awk '{print $1}')
          arm=$(shasum -a 256 "$tmp/arm.tar.xz" | awk '{print $1}')
          sed -i '' "s/__VERSION__/$VERSION/g; s/__TAG__/$TAG/g; s/__SHA256_INTEL__/$intel/g; s/__SHA256_ARM__/$arm/g" tap/Formula/lazydb.rb
          git -C tap config user.name lazydb-release-bot
          git -C tap config user.email lazydb-release-bot@users.noreply.github.com
          git -C tap add Formula/lazydb.rb
          git -C tap commit -m "Update lazydb to $VERSION" || true
          git -C tap push
